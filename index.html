<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HN Studios — Admin</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#f5f5f3;margin:0;padding:40px;}
  h1{font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;}
  .hint{color:#a8a8a4;font-size:13px;margin-bottom:32px;}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#a8a8a4;margin:36px 0 12px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(245,245,243,.14);vertical-align:top;}
  th{color:#a8a8a4;text-transform:uppercase;font-size:11px;letter-spacing:.08em;}
  .status-paid{color:#8ee6a1;}
  .status-pending{color:#e0c07a;}
  pre{white-space:pre-wrap;font-size:12px;color:#a8a8a4;margin:0;font-family:inherit;}
  .empty{color:#a8a8a4;padding:14px 0;}
</style>
</head>
<body>
  <h1>HN Studios — Admin</h1>
  <p class="hint">Orders and contact-form submissions. Your browser will ask for the admin username/password on load.</p>

  <h2>Orders</h2>
  <table id="orders-table">
    <thead><tr><th>Date</th><th>Status</th><th>Customer</th><th>Items</th><th>Total</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Contact messages</h2>
  <table id="messages-table">
    <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>Message</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
  async function load() {
    const [orders, messages] = await Promise.all([
      fetch('/api/admin/orders').then(r => r.json()),
      fetch('/api/admin/messages').then(r => r.json()),
    ]);

    const ordersBody = document.querySelector('#orders-table tbody');
    ordersBody.innerHTML = orders.length ? orders.map(o => `
      <tr>
        <td>${new Date(o.created_at).toLocaleString()}</td>
        <td class="status-${o.status}">${o.status}</td>
        <td>${o.customer_name || ''}${o.customer_email ? ' &lt;' + o.customer_email + '&gt;' : ''}</td>
        <td><pre>${o.cart.map(i => `${i.pid} (${i.size}) x${i.qty}`).join('\n')}</pre></td>
        <td>$${(o.total_cents / 100).toFixed(2)}</td>
      </tr>
    `).join('') : '<tr><td colspan="5" class="empty">No orders yet.</td></tr>';

    const messagesBody = document.querySelector('#messages-table tbody');
    messagesBody.innerHTML = messages.length ? messages.map(m => `
      <tr>
        <td>${new Date(m.created_at).toLocaleString()}</td>
        <td>${m.name}</td>
        <td>${m.email}</td>
        <td>${m.phone || ''}</td>
        <td>${m.message || ''}</td>
      </tr>
    `).join('') : '<tr><td colspan="5" class="empty">No messages yet.</td></tr>';
  }

  load().catch(err => {
    document.body.insertAdjacentHTML('beforeend', `<p style="color:#e08a7a">Failed to load: ${err.message}</p>`);
  });
</script>
</body>
</html>
